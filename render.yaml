services:
  - type: web
    name: bypass-forms-mvp
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/src/storage/bypass-forms.db
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEFAULT_PASS
        sync: false
    disk:
      name: bypass-forms-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
